# Reverse proxy for the router status dashboard on https://status.mac.zin7.de (port 443).
# Separate nginx instance (root, via LaunchDaemon) so the existing Homebrew nginx
# (:5230/:8888, user zin) is untouched. Proxies to the dashboard HTTPS backend
# on 127.0.0.1:18933 (proxy_ssl_verify off: loopback, same cert).
# Chosen approach: proxy to the HTTPS backend (no dashboard change), so the
# direct https://status.mac.zin7.de:18933 URL keeps working as a fallback.
# HTTP on port 80 redirects to HTTPS (301) so http://status.mac.zin7.de/ works.
user nobody;
worker_processes 1;
pid /opt/homebrew/var/run/nginx-status-443.pid;
error_log /opt/homebrew/var/log/nginx/status-443-error.log;

events {
    worker_connections 1024;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Temp paths separate from the Homebrew nginx instance (avoid permission clashes)
    client_body_temp_path /opt/homebrew/var/run/nginx-status-443/client_body_temp;
    proxy_temp_path /opt/homebrew/var/run/nginx-status-443/proxy_temp;
    fastcgi_temp_path /opt/homebrew/var/run/nginx-status-443/fastcgi_temp;
    uwsgi_temp_path /opt/homebrew/var/run/nginx-status-443/uwsgi_temp;
    scgi_temp_path /opt/homebrew/var/run/nginx-status-443/scgi_temp;

    access_log /opt/homebrew/var/log/nginx/status-443-access.log;

    server {
        listen 80;
        server_name status.mac.zin7.de;
        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name cp.zin7.de ha.zin7.de cpl.zin7.de;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name status.mac.zin7.de;

        ssl_certificate /Users/zin/mac-compute/certs/status.mac.zin7.de.fullchain.crt;
        ssl_certificate_key /Users/zin/mac-compute/certs/status.mac.zin7.de.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass https://127.0.0.1:18933;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            # Dashboard responses are small; never buffer proxy replies to disk
            proxy_max_temp_file_size 0;
        }
    }

    # mac-compute on the default port: https://cp.zin7.de/ (no :5850 needed).
    # Proxies to the FastAPI app on 127.0.0.1:5850 (HTTPS loopback, verify off).
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cp.zin7.de;

        ssl_certificate /Users/zin/mac-compute/certs/cp.zin7.de.fullchain.crt;
        ssl_certificate_key /Users/zin/mac-compute/certs/cp.zin7.de.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        client_max_body_size 100M;

        location / {
            proxy_pass https://127.0.0.1:5850;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }
    }

    # Home Assistant on Huawei Cloud, via Tailscale (Mac forwards, valid Mac cert).
    # Backend: Huawei HA at 100.94.191.11:8123 over the encrypted Tailscale tunnel.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name ha.zin7.de;

        ssl_certificate /Users/zin/mac-compute/certs/ha.zin7.de.fullchain.crt;
        ssl_certificate_key /Users/zin/mac-compute/certs/ha.zin7.de.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        client_max_body_size 100M;

        location / {
            proxy_pass http://100.94.191.11:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }
    }

    # Nav page: https://cpl.zin7.de/ — service directory, login = cp credentials.
    # Proxies / to the nav FastAPI app on 127.0.0.1:18936 (HTTP loopback).
    # /proxy-test/ and /api/ forward to the proxy-test app on 127.0.0.1:18935,
    # gated by nginx auth_request against the nav app's /auth-check.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name cpl.zin7.de;

        ssl_certificate /Users/zin/mac-compute/certs/cpl.zin7.de.fullchain.crt;
        ssl_certificate_key /Users/zin/mac-compute/certs/cpl.zin7.de.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        client_max_body_size 100M;

        error_page 401 = @login_redirect;
        location @login_redirect {
            return 302 /login?next=$request_uri;
        }

        location = /auth-check {
            internal;
            proxy_pass http://127.0.0.1:18936/auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:18936;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        location /proxy-test/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18935/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        location /api/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18935/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300;
        }

        # sub-convert: https://cpl.zin7.de/convert/ — subscription converter
        # (auto speed-test + 精选 top 3, hourly). UI + API gated by the same
        # cp login as proxy-test. /s/<token>.yaml is PUBLIC (no auth) so
        # FlClash can fetch it; the 32-hex token is the credential.
        location /convert/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18937/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        location /convert-api/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18937/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300;
        }

        location = /dy {
            return 301 /dy/;
        }

        # dy-filter: https://cpl.zin7.de/dy/ — 115 云端视频预筛工作台
        # (Flask on 127.0.0.1:18939, blueprint prefix /dy kept). UI + API
        # gated by the same cp login as /convert/. No public path.
        location /dy/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18939/dy/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        location = /dji {
            return 301 /dji/;
        }

        # dji-compress: https://cpl.zin7.de/dji/ — DJI 视频压缩工作台
        # (FastAPI on 127.0.0.1:18940, prefix /dji kept). UI + API
        # gated by the same cp login as /dy/ and /convert/. No public path.
        # client_max_body_size 0: DJI files are multi-GB; the server
        # block default (100M) would reject browser uploads. Long
        # timeouts for large uploads and long encodes.
        location /dji/ {
            auth_request /auth-check;
            client_max_body_size 0;
            proxy_pass http://127.0.0.1:18940/dji/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
        }

        # traffic-monitor: https://cpl.zin7.de/traffic/ — local road-congestion
        # monitoring (Gaode API, 5-min polls). Auth-gated like /dji/ and /dy/.
        location /traffic/ {
            auth_request /auth-check;
            proxy_pass http://127.0.0.1:18941/traffic/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300;
        }

        # ping-test: https://cpl.zin7.de/ping/<token>/ — IP latency tester.
        # PUBLIC token link (no auth_request; the 32-hex token in the URL
        # is the credential, same pattern as /s/). The app validates the
        # token; wrong token -> 404. Admin actions need the cp password.
        location /ping/ {
            proxy_pass http://127.0.0.1:18938/ping/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 300;
        }

        location /s/ {
            proxy_pass http://127.0.0.1:18937/s/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60;
        }
    }
}
